# Coolify (build pack Docker Compose). Postgres e WAHA são recursos
# compartilhados do projeto `infra`, na rede predefinida `coolify`
# (ligar "Connect To Predefined Network" na aba Network do recurso).
# Domínio no serviço `web` com a porta: https://control.costatech.dev:8000 (o Traefik
# usa o sufixo como porta interna; não publica nada).

x-app: &app
  build: .
  restart: unless-stopped
  init: true
  environment:
    TZ: America/Sao_Paulo
    DEBUG: "False"
    SECRET_KEY: ${SECRET_KEY:?}
    # Sem esquema, terminando em `,localhost` (healthcheck). Ex: control.costatech.dev,localhost
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:?}
    # Com esquema. Ex: https://control.costatech.dev
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?}
    DATABASE_URL: ${DATABASE_URL:?}
    EMAIL_HOST: ${EMAIL_HOST:?}
    EMAIL_PORT: ${EMAIL_PORT:?}
    EMAIL_HOST_USER: ${EMAIL_HOST_USER:?}
    EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:?}
    ALERT_EMAIL_RECIPIENT: ${ALERT_EMAIL_RECIPIENT:?}
    # Base pública para os links curtos /p/<ref>/. Ex: https://control.costatech.dev
    APP_BASE_URL: ${APP_BASE_URL:?}
    INFINITEPAY_HANDLE: ${INFINITEPAY_HANDLE:-}
    INFINITEPAY_API_KEY: ${INFINITEPAY_API_KEY:-}
    INFINITEPAY_BASE_URL: ${INFINITEPAY_BASE_URL:-}
    # Recadastrar no InfinitePay se o domínio mudar. Ex: https://control.costatech.dev/webhooks/...
    INFINITEPAY_WEBHOOK_URL: ${INFINITEPAY_WEBHOOK_URL:-}
    INFINITEPAY_REDIRECT_URL: ${INFINITEPAY_REDIRECT_URL:-}
    INFINITEPAY_ITEM_DESCRIPTION: ${INFINITEPAY_ITEM_DESCRIPTION:-}
    WAHA_URL: ${WAHA_URL:?}
    WAHA_API_KEY: ${WAHA_API_KEY:?}
    WAHA_SESSION: ${WAHA_SESSION:-default}
    WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    # Bot Telegram global (Team Shared Variables); vazio = sem avisos.
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}

services:
  web:
    <<: *app
    # Serviço único: sem worker/beat/Redis. Os jobs periódicos são Scheduled Tasks
    # do Coolify rodando `python manage.py run_job <nome>` neste container
    # (lista e cron em DOCUMENTACAO_GERAL.md). `--threads 4` = gthread: o webhook
    # que manda a confirmação no WAHA (até 10s) não prende o worker inteiro.
    command: sh -c "python manage.py migrate --noinput && exec gunicorn app.wsgi:application --bind 0.0.0.0:8000 --threads 4 --timeout 120"
    volumes:
      - media:/app/media
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/', timeout=4)"]
      # ponytail: 60s p/ poupar CPU (cada check sobe um processo); start_interval acelera a subida.
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 5s

volumes:
  media:
